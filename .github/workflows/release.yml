name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or reuse draft release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace(/^refs\/tags\//, "");
            // The tag endpoint can return 404 for an existing draft. Enumerate
            // drafts as well so reruns cannot split assets across two releases.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const matches = releases.filter(release => release.tag_name === tag);
            if (matches.length > 1) {
              core.setFailed(`Multiple releases exist for ${tag}; consolidate drafts before retrying`);
              return;
            }
            let release = matches[0];
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `LevelUpAgent ${tag}`,
                body: "Cross-platform release. macOS apps are ad-hoc signed after bundling and verified after a simulated installation; they are not notarized.",
                draft: true,
                prerelease: false,
              })).data;
            }
            if (!release.draft) {
              core.setFailed(`Release ${tag} already exists and is not a draft`);
              return;
            }
            core.setOutput("release_id", String(release.id));

  bundle:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis,msi"
            config_args: "--config src-tauri/tauri.release.conf.json"
            asset_name_pattern: "LevelUpAgent_[version]_Windows_x64[setup][ext]"
            rust_target: ""
            include_updater_json: true
            updater_json_prefer_nsis: true
          - platform: macos-latest
            args: ""
            config_args: ""
            asset_name_pattern: "LevelUpAgent_[version]_macOS_Apple-Silicon[ext]"
            rust_target: aarch64-apple-darwin
            include_updater_json: false
            updater_json_prefer_nsis: false
          - platform: macos-15-intel
            args: ""
            config_args: ""
            asset_name_pattern: "LevelUpAgent_[version]_macOS_Intel-x64[ext]"
            rust_target: x86_64-apple-darwin
            include_updater_json: false
            updater_json_prefer_nsis: false
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb,rpm --no-sign"
            config_args: ""
            asset_name_pattern: "LevelUpAgent_[version]_Linux_x64[ext]"
            rust_target: ""
            include_updater_json: false
            updater_json_prefer_nsis: false
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm
      - name: Install frontend dependencies
        if: runner.os != 'macOS'
        run: pnpm install --frozen-lockfile
      - name: Prepare signed updater configuration
        if: matrix.config_args != ''
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/write-release-config.mjs
      - name: Enable updater support for Windows
        if: matrix.config_args != ''
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "LEVELUP_ENABLE_UPDATER=1"
      - name: Build and sign macOS DMG
        if: runner.os == 'macOS'
        env:
          MACOS_BUILD_TARGET: ${{ matrix.rust_target }}
          MACOS_OUTPUT_DIR: ${{ github.workspace }}/artifacts/macos
          MACOS_SIGNING_IDENTITY: "-"
        run: bash scripts/build-macos.sh
      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require("node:fs/promises");
            const { createHash } = require("node:crypto");
            const files = (await fs.readdir("artifacts/macos")).filter(name => name.endsWith(".dmg"));
            if (files.length !== 1) throw new Error(`Expected one macOS DMG, found ${files.length}`);
            const release_id = Number(process.env.RELEASE_ID);
            const params = { owner: context.repo.owner, repo: context.repo.repo, release_id };
            const release = (await github.rest.repos.getRelease(params)).data;
            if (!release.draft) throw new Error("Refusing to modify a published release");
            const name = files[0];
            const data = await fs.readFile(`artifacts/macos/${name}`);
            const digest = `sha256:${createHash("sha256").update(data).digest("hex")}`;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...params, per_page: 100 });
            const existing = assets.find(asset => asset.name === name);
            if (existing?.state === "uploaded" && existing.size === data.length && existing.digest === digest) return;
            if (existing) await github.rest.repos.deleteReleaseAsset({
              owner: params.owner, repo: params.repo, asset_id: existing.id,
            });
            await github.rest.repos.uploadReleaseAsset({
              ...params, name, data,
              headers: { "content-type": "application/octet-stream", "content-length": data.length },
            });
      - name: Build and upload non-macOS bundle
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: LevelUpAgent ${{ github.ref_name }}
          releaseBody: Cross-platform release. See the repository changelog and release notes.
          releaseDraft: true
          prerelease: false
          assetNamePattern: ${{ matrix.asset_name_pattern }}
          includeUpdaterJson: ${{ matrix.include_updater_json }}
          updaterJsonPreferNsis: ${{ matrix.updater_json_prefer_nsis }}
          args: ${{ matrix.config_args }} ${{ matrix.args }}
